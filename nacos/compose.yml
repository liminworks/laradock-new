services:

    nacos:
      restart: always
      image: nacos/nacos-server:v2.4.3
      container_name: nacos-standalone
      environment:
        - PREFER_HOST_MODE=hostname
        - MODE=standalone
        - NACOS_AUTH_IDENTITY_KEY=nacos_server_identity_key
        - NACOS_AUTH_IDENTITY_VALUE=nacos_server_identity_value
        - NACOS_AUTH_TOKEN=CZ0Yv94JbA4dm3eJhRaEvKlxUnTfOOFimcO1c1KV8Li2AyR4odARP/p7cAHNmbZb
      ports:
        # Nacos 2.x 控制台与主服务共用 8848（路径 /nacos）；独立 8080 控制台端口是 3.x 才有
        - "8848:8848"
        - "9848:9848"
      volumes:
        - ./nacos/standalone-logs/:/home/nacos/logs
        - ./nacos/data/:/home/nacos/data
      networks:
        - backend
